    body: |
      **Left worse than right.** The pads are swollen and hardened. On examination the
      right front pads were also judged mildly affected. `[O]`

      ### What the photographs show `[I]`

      The metacarpal (central) pad is markedly enlarged and rounded, the normal pad
      surface texture is largely lost, and there are areas of pale, pink, depigmented
      surface where the surrounding pad tissue is dark. The swelling is confined to the
      pad itself rather than the whole paw. No open wound, discharge or bleeding is
      visible.

      ### Differentials raised at the consultation `[O]`

      Autoimmune disease · allergy · foreign body · a foot-and-mouth-like condition
      (raised by Dr. Burkard by analogy with other species; not a recognised feline
      diagnosis).

      ### Plan

      **Biopsy under general anaesthesia, Monday 17 August 2026, 08:00**, at
      Katzen-Praxis. FeLV and FIV testing at the same appointment.

      ### Still unrecorded

      - Whether the hind paws are involved
