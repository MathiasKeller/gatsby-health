  - id: P3
    slug: forelimb-lameness
    title: Recurrent forelimb lameness
    short: Lameness
    status: recurrent
    status_label: Recurrent — currently quiescent
    onset: 2025-04-30
    band_start: 2025-04-30
    diagnosis: "2025 episode: septic arthritis MCP IV with osteomyelitis. Cause never established."
    colour: amber
    body: |
      The longest-running and most incompletely explained thread in Gatsby's history.
      **Four episodes in 24 months, all of them left-sided**, in a strictly indoor,
      single-cat household with no observed trauma. Only one episode ever produced a
      diagnosis, and that diagnosis was never traced to a cause.

      ---

      ### Episode 0 · 30 April 2025 — left forelimb

      At his first Swiss consultation, lameness was recorded with no pain on
      manipulation and an otherwise normal general condition. Treated with meloxicam.
      `[S1]`

      > `[Q]` **Correction.** The Andreaspark record states *"Lahmheit vorne rechts"* —
      > lameness front **right** `[S1]`. The owners confirm the affected limb was the
      > **left**, consistent with every subsequent episode. This is a transcription
      > error in the practice record. Anyone requesting the original document from
      > Andreaspark will see "rechts"; it should be read as left. `[O]`

      ---

      ### Episode 1 · July–September 2025 — the major episode

      **Course.** A limp was noticed around 25.07.2025 after roughly two hours
      unobserved at home `[O]`. Over three weeks it progressed from grade 2/4 to
      complete non-weight-bearing (5/5), unresponsive to two NSAIDs, and then to a
      swollen, painful limb up to the elbow with regional lymphadenopathy.

      #### The diagnostic detour

      On 15.08.2025 a **fracture of digit IV was suspected on radiographs read by a
      veterinary assistant (PTA)** and a cast was applied under anaesthesia `[S9]`.

      On 21.08.2025 Dr. Wendler examined Gatsby and explicitly **did not accept this**.
      He found the shoulder and elbow non-painful, the **carpus clearly painful on
      flexion**, and only questionable pain at digit IV — noting that the toe finding
      *"does not on its own explain the massive lameness."* He recorded the radiographic
      appearance as a *questionable porous bone structure* of digit IV, left the
      diagnosis **open**, and referred to the Tierspital for CT. `[S9]`

      > **The fracture was never confirmed and forms no part of the final diagnosis.**

      #### Tierspital findings, 25–27 August 2025 `[S2]`

      **Clinical.** Vital parameters normal. Lameness 5/5. Swelling of the paw extending
      to the proximal antebrachium. Pain on lateral palpation of the entire limb.
      Enlarged left prescapular lymph node. **A small wound with redness in the web
      between digits 3 and 4.**

      **CT with iodinated contrast.**

      - Poorly defined, permeative lysis at the **distal Os metacarpale IV**, more pronounced abaxially
      - Involvement of the **palmar sesamoid bones**, more markedly the abaxial one, with moderate bone loss
      - Less pronounced change at the proximal part of the **proximal phalanx of digit IV**
      - Severe circumferential soft-tissue swelling centred on the **metacarpophalangeal joint IV**, with severe circumferential contrast enhancement — extending proximally to mid-diaphysis of MC IV, distally to the distal phalanx, both palmar-accentuated, and axially and abaxially into the interdigital spaces, following the course of the **deep digital flexor tendon** of that digit
      - After contrast, a relatively hypoattenuating zone around the tendon (tendon sheath)
      - **Severely enlarged left superficial cervical lymph node** (~1.8 cm), heterogeneous enhancement
      - Mildly enlarged left accessory axillary lymph node

      **CT diagnosis.** Severe arthritis of the metacarpophalangeal joint IV with
      **polyostotic osteomyelitis**, severe **tendovaginitis of the deep digital flexor
      tendon** (digit IV), and severe accompanying soft-tissue swelling. Severe left
      superficial cervical lymphadenomegaly.

      **CT conclusion.** Findings suspicious for **septic arthritis and tenovaginitis
      with phlegmon and reactive regional lymphadenomegaly** — for example following a
      bite or stepping on a sharp object. Foreign material such as small plant fragments
      **not visible, though its presence cannot be excluded.** Neoplastic causes
      (fibrosarcoma, squamous cell carcinoma) considered unlikely.

      **Ultrasound.** Severe circumferential dilatation of the tendon sheath around the
      terminal tendon of extensor digitorum IV, fibre pattern intact. Punctate
      hyperechoic foci within one of the flexors palmarolaterally at the level of the
      accessory carpal bone (most likely flexor carpi ulnaris). Small zones of
      corpuscular content along the palmar contour of the metacarpals. The MCP joint of
      digit IV distended dorsally at the level of the punctate wound in the 3rd/4th
      interdigital space, with mildly irregular joint margins.

      **Ultrasound conclusion.** Strong suspicion of a probably **septic tenovaginitis
      of the flexor tendon sheath of MC IV** and **phlegmon** along the distal left
      forelimb, palmar-accentuated. The hyperechoic foci remained unexplained —
      differentials small gas accumulations or fibrosis, **with no clear indication of
      foreign material**. Fluid accumulations were too small to aspirate safely.

      **Lymph node aspirate.** Mild reactive hyperplasia — a non-specific finding
      secondary to antigenic stimulation.

      #### Final diagnosis `[S2]`

      Phlegmon of the left forelimb with signs of osteomyelitis of the left distal
      extremity (left paw, digit IV). Cause unknown; a small foreign body suspected but
      never demonstrated.

      #### Treatment and response `[S2]`

      Inpatient IV antibiotics and analgesia. **Marked improvement in gait within one
      day**, swelling almost fully resolved. **No surgical indication.** Discharged on
      Clavaseptin, Gabapentin and Buprenorphine with 1–2 weeks of rest.

      #### Outcome `[O]`

      The leg appeared normal afterwards. A recheck appointment was attended and the
      Tierspital reported that everything was fine, but **no written report was
      received** and **no follow-up bloodwork was performed**.

      ---

      ### Episode 2 · 2 April 2026

      Emergency consultation at ALOHA Kleintierpraxis for left forelimb lameness.
      Treated with meloxicam by subcutaneous injection plus oral suspension, and a
      homeopathic preparation. **No cause identified.** Resolved after about three days.
      `[S10]` `[O]`

      > Only a receipt exists for this visit. No clinical findings were recorded in any
      > document held.

  - id: P4
    slug: pruritus
    title: Pruritus with ear pustules and crusting
    short: Skin
    status: unresolved
    status_label: Unresolved — workup never done
    onset: 2025-09-11
    band_start: 2025-09-11
    diagnosis: Undetermined
    colour: amber
    body: |
      ### Presentation, 11 September 2025 `[S4]`

      Presented on emergency for acute itching and skin reddening. General condition
      good, vitals within normal limits (T 38.0 °C, HR 160/min, RR 54/min mildly
      elevated), weight 5.14 kg, BCS 5/9. Behaviour: bright, alert and responsive
      **but anxious**.

      **Findings.** Both ears reddened, especially on the inner surface, with
      **pustules on the ear margins and crusting on the outer surface at the ear
      margin (right worse than left)**, itchy when rubbed. **Abdomen reddened with
      small crusts.** No alopecia. **Paws unremarkable.** Oral examination normal.
      Heart and lung auscultation normal.

      **Diagnosis.** Pruritus, cause undetermined at the time.

      **Treatment.** Advocate spot-on (antiparasitic); Leniskin foam; Apoquel 5.4 mg
      half a tablet twice daily, with the explicit instruction that it must be tapered
      rather than stopped abruptly; continue the antibiotics from the surgical
      department.

      **Recommendation.** A full dermatological workup was not possible in the emergency
      setting. An appointment with the Dermatology department, or another dermatology
      specialist, was requested for the following Monday.

      ### What happened next `[O]`

      Apoquel was given for approximately one week. **The dermatology workup was never
      carried out.** Whether the tapering instruction was followed is not recorded, and
      the outcome of the skin signs was never documented.

      > **This is the largest unclosed loop in the record.** A specialist workup was
      > formally requested by the treating clinic and never happened, and the condition
      > was never given a diagnosis.

