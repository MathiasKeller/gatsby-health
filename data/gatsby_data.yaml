actions_urgent:
  - text: >
      **Bring the 11.09.2025 emergency report to Monday's appointment.** It documents
      pustules and crusts on both ear margins with generalised itching, eleven months
      ago, and it was never followed up. Katzen-Praxis have almost certainly not seen
      it — it sits in an emergency report from a different department of a different
      hospital. Ear margins and footpads are both sites that matter when immune-mediated
      skin disease is on the differential list, and the clinicians already raised
      autoimmune disease independently.
  - text: >
      **Ask for a pre-anaesthetic blood panel including renal values and a complete
      blood count.** Creatinine was 171 µmol/l in August 2025, a recheck was formally
      recommended, and it never happened. No CBC has ever been run.
  - text: >
      **Ask whether corticosteroids or other immunosuppressives should be withheld
      until after the biopsy.** Starting them beforehand can compromise histopathology.
      Do not start any such medication before Monday without discussing it first.
  - text: >
      **Ask whether they want additional samples taken in the same anaesthesia** — for
      example tissue for bacterial and fungal culture alongside the histopathology,
      given the documented history of deep infection.
  - text: >
      **Confirm which paws are affected** and whether the hind paws should be examined
      too.

