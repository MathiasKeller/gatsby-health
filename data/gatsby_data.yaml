  - id: P6
    slug: cardiac
    title: Sinus arrhythmia
    short: Cardiac
    status: monitoring
    status_label: Normal heart — monitoring
    onset: 2025-10
    band_start: 2025-09-20
    band_end: 2025-10-02
    diagnosis: Structurally and functionally normal heart
    colour: green
    body: |
      ### Reason for referral, 2 October 2025 `[S5]`

      Internal investigation of a newly detected cardiac rhythm abnormality.

      **Clinical.** General condition good, bright. After prolonged play, mild exercise
      intolerance with tachypnoea, normalising quickly. No open-mouth breathing.
      **No heart murmur.** HR 168/min, slightly arrhythmic.

      **ECG** (Dr. Ivona Badric, Cardiology). PR interval constant; QRS complexes narrow
      (30 ms), normal morphology; R-R interval not constant; HR 136/min.
      → **Sinus arrhythmia.**

      **Echocardiography.** Normal chamber volumes, small left auricle, normal wall
      thickness, a false tendon attaching to the interventricular septum, no systolic
      anterior motion of the mitral valve, pulmonary veins not congested, no turbulence
      on colour Doppler.

      | Parameter | Value |
      |---|---|
      | LA max | 1.55 cm |
      | LA/Ao | 1.4 |
      | IVSd | 0.37 cm long axis / 0.38 cm short axis |
      | LVPWd | 0.40 cm long axis / 0.36 cm short axis |
      | LVDd / LVDs | 1.5 cm / 0.8 cm |
      | **Fractional shortening** | **47 %** |
      | MV E/A | 1.2 |
      | Vmax pulmonary artery | 0.8 m/s |
      | Vmax aorta | 1.0 m/s |

      **Diagnosis.** Structurally and functionally normal heart; sinus arrhythmia.

      **Treatment.** None required.

      **Recommendation.** Because Siberians are predisposed to HCM, a screening
      echocardiogram in **2–3 years** — due late 2027 to late 2028 — or sooner at any
      point if a murmur, arrhythmia or gallop rhythm is heard.

  - id: P7
    slug: renal
    title: Mildly elevated creatinine
    short: Renal
    status: open
    status_label: Never rechecked
    onset: 2025-08-27
    band_start: 2025-08-27
    diagnosis: Single abnormal value, unrepeated
    colour: grey
    body: |
      Serum creatinine on 27 August 2025 was **171 µmol/l** against a reference interval
      of 98–163 µmol/l — mildly elevated. The Tierspital explicitly recommended
      **repeat bloodwork in 2–4 weeks** `[S2]`.

      **This recheck was never performed** `[O]`. Nearly a year has passed.

      > **Context matters.** This sample was taken during an active systemic infection,
      > on NSAIDs, in a hospitalised cat — all of which can transiently affect renal
      > parameters. A single value in that setting is not evidence of kidney disease.
      > It is simply unresolved.

      Given the general anaesthesia scheduled for 17 August 2026, renal values are worth
      including in a pre-anaesthetic panel.

