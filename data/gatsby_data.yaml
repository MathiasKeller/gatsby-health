# =============================================================================
# OBSERVATIONS FROM ASSEMBLING THE RECORD — inferences, not diagnoses
# =============================================================================
analysis:
  - title: A pattern no single clinician has been positioned to see
    body: |
      Each episode was handled by a different practice, and no one has held the whole
      file at once.

      | Date | Event | Clinic |
      |---|---|---|
      | Apr 2025 | Forelimb lameness (left) | Andreaspark |
      | Jul–Sep 2025 | Severe deep infection, left forelimb digit IV, cause never found | Andreaspark → Wendler → Tierspital |
      | Sep 2025 | Pruritus with pustules and crusts on both ear margins, never worked up | Tierspital (Emergency) |
      | Apr 2026 | Forelimb lameness (left), no cause found | ALOHA |
      | Aug 2026 | Bilateral footpad swelling and oral lesions, cause unknown | Katzen-Praxis |

      Recurrent, self-resolving or unexplained lesions at multiple sites — pads, ear
      margins, oral mucosa — in a strictly indoor cat with no trauma exposure is a
      pattern that would reasonably prompt a clinician to consider systemic or
      immune-mediated causes alongside local ones. The clinicians at the current
      practice raised autoimmune disease independently. The point here is narrower:
      **the September 2025 ear findings are the piece most likely to be missing from
      their picture**, because they sit in an emergency report from a different
      department of a different hospital.

  - title: The absence of an identified cause is itself a finding
    body: |
      Across three separate lameness episodes, three practices, radiographs, CT with
      contrast and ultrasound, **no trauma, foreign body or inciting event was ever
      demonstrated** — in an indoor-only cat. The Tierspital left "foreign body" on the
      list only because it could not be excluded, not because anything was found.

  - title: A timing overlap worth not losing
    body: |
      The September 2025 pruritus began while Gatsby was partway through a four-week
      course of amoxicillin-clavulanate. Whether that is coincidence or relevant is a
      question for a dermatologist, but the overlap is in the record.

